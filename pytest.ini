[pytest]
testpaths = tests
pythonpath = .
# Las pruebas funcionales (Playwright) se corren aparte: pytest -m funcional tests/funcionales
addopts = -m "not funcional"
markers =
    funcional: pruebas de caja negra de extremo a extremo con Playwright (RTF4)
filterwarnings =
    ignore::DeprecationWarning:starlette.*
